<!DOCTYPE html>
<html lang="en">
<head><title>Media Optimizer</title></head>
<body>
<div id="MediaOptimizerQueuePage" data-role="page" class="page type-interior pluginConfigurationPage">
  <div data-role="content">
    <div class="content-primary">

      <details class="moptPanel" id="moptDiagPanel">
        <summary class="moptSummary">
          <span class="moptDot" id="moptDiagDot"></span>
          <span id="moptDiagLine">Checking…</span>
          <span class="moptSummaryHint">details</span>
        </summary>
        <div id="moptDiag" class="moptPanelBody"></div>
      </details>

      <details class="moptPanel" id="moptPickerPanel" open>
        <summary class="moptSummary">
          <strong>Choose files to convert</strong>
          <span class="moptSummaryHint" id="moptPickerHint"></span>
        </summary>
        <div class="moptPanelBody">

        <div class="moptFilters">
          <div class="moptFilter moptFilterWide">
            <label for="moptSearch">Search</label>
            <input is="emby-input" type="text" id="moptSearch" placeholder="Title, or leave empty for everything" />
          </div>
          <div class="moptFilter">
            <label for="moptSort">Sort by</label>
            <select is="emby-select" id="moptSort" class="emby-select">
              <option value="SizeDescending">Largest first</option>
              <option value="SizeAscending">Smallest first</option>
              <option value="ResolutionDescending">Highest resolution</option>
              <option value="BitrateDescending">Highest bitrate</option>
              <option value="DateAdded">Recently added</option>
              <option value="Name">Name (A–Z)</option>
            </select>
          </div>
          <div class="moptFilter">
            <label for="moptWatched">Watched</label>
            <select is="emby-select" id="moptWatched" class="emby-select">
              <option value="Any">Any</option>
              <option value="Watched">Watched only</option>
              <option value="Unwatched">Unwatched only</option>
            </select>
          </div>
          <div class="moptFilter">
            <label for="moptMinHeight">Min resolution</label>
            <select is="emby-select" id="moptMinHeight" class="emby-select">
              <option value="">Any</option>
              <option value="2160">4K and up</option>
              <option value="1440">1440p and up</option>
              <option value="1080">1080p and up</option>
              <option value="720">720p and up</option>
            </select>
          </div>
          <div class="moptFilter">
            <label for="moptMinSize">Min size</label>
            <select is="emby-select" id="moptMinSize" class="emby-select">
              <option value="">Any</option>
              <option value="20480">20 GB and up</option>
              <option value="10240">10 GB and up</option>
              <option value="5120">5 GB and up</option>
              <option value="2048">2 GB and up</option>
              <option value="1024">1 GB and up</option>
            </select>
          </div>
          <div class="moptFilter">
            <label for="moptContainer">Container</label>
            <select is="emby-select" id="moptContainer" class="emby-select"><option value="">Any</option></select>
          </div>
          <div class="moptFilter">
            <label for="moptCodec">Codec</label>
            <select is="emby-select" id="moptCodec" class="emby-select"><option value="">Any</option></select>
          </div>
        </div>

        <div class="moptSelectBar">
          <label class="moptSelectAll">
            <input type="checkbox" id="moptSelectAll" /> <span>Select all shown</span>
          </label>
          <span id="moptSelectionInfo" class="moptDim">Nothing selected</span>
          <span style="flex:1"></span>
          <button is="emby-button" type="button" id="moptBatch" class="raised button-submit emby-button" disabled>
            Convert selected…
          </button>
        </div>

        <div id="moptResults"></div>
        </div>
      </details>

      <div class="verticalSection">
        <h2 class="sectionTitle">Queue</h2>
        <div id="moptStats" class="moptStats"></div>
        <div class="moptQueueBar">
          <button is="emby-button" type="button" id="moptPause" class="raised emby-button">Pause queue</button>
          <button is="emby-button" type="button" id="moptClear" class="raised emby-button">Cancel everything pending</button>
          <button is="emby-button" type="button" id="moptRelease" class="raised emby-button">Delete originals kept for undo</button>
        </div>
        <div id="moptActiveJobs"></div>

        <details class="moptPanel" id="moptHistoryPanel">
          <summary class="moptSummary">
            <strong>History</strong>
            <span class="moptSummaryHint" id="moptHistoryHint"></span>
          </summary>
          <div id="moptJobs" class="moptPanelBody"></div>
        </details>
      </div>

    </div>
  </div>

  <style>
    .moptCheck{display:flex;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid rgba(128,128,128,.22)}
    .moptCheck:last-child{border-bottom:0}
    .moptDot{flex:0 0 auto;width:10px;height:10px;border-radius:50%;margin-top:6px}
    .moptDot.ok{background:#4caf50}.moptDot.warning{background:#e6aa3c}
    .moptDot.failed{background:#e05a50}.moptDot.disabled{background:#8a8a8a}
    .moptCheckName{font-weight:600}
    .moptCheckDetail{font-size:13px;opacity:.75;margin-top:2px}
    .moptBanner{padding:10px 13px;border-radius:5px;margin-bottom:12px;font-weight:600}
    .moptBanner.ok{background:rgba(76,175,80,.16)}
    .moptBanner.warning{background:rgba(230,170,60,.16)}
    .moptBanner.failed{background:rgba(224,90,80,.18)}

    .moptFilters{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
    .moptFilter{display:flex;flex-direction:column;gap:4px;flex:1 1 150px;min-width:0}
    .moptFilterWide{flex:2 1 260px}
    .moptFilter label{font-size:12px;opacity:.7}
    .moptSelectBar{display:flex;align-items:center;gap:14px;flex-wrap:wrap;
      padding:9px 0;border-top:1px solid rgba(128,128,128,.25);
      border-bottom:1px solid rgba(128,128,128,.25);margin-bottom:10px}
    .moptSelectAll{display:flex;align-items:center;gap:7px;cursor:pointer;font-size:13.5px}
    .moptDim{opacity:.65;font-size:13px}

    .moptItem{display:flex;gap:12px;align-items:center;border:1px solid rgba(128,128,128,.3);
      border-radius:5px;padding:9px 12px;margin-bottom:7px}
    .moptItem.sel{border-color:#00a4dc;background:rgba(0,164,220,.07)}
    .moptItemBody{min-width:0;flex:1}
    .moptItemName{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .moptItemMeta{font-size:12.5px;opacity:.68;margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .moptTag{display:inline-block;font-size:10px;text-transform:uppercase;letter-spacing:.05em;
      padding:1px 5px;border-radius:3px;background:rgba(128,128,128,.28);margin-left:6px;font-weight:700}

    .moptJob{border:1px solid rgba(128,128,128,.35);border-radius:5px;padding:12px 14px;margin-bottom:10px}
    .moptJobHead{display:flex;gap:12px;align-items:baseline;justify-content:space-between;flex-wrap:wrap}
    .moptJobName{font-weight:600}
    .moptJobStatus{font-size:12px;text-transform:uppercase;letter-spacing:.07em;opacity:.75}
    .moptJobMeta{font-size:13px;opacity:.7;margin-top:5px}
    .moptBar{height:5px;border-radius:3px;background:rgba(128,128,128,.3);overflow:hidden;margin-top:8px}
    .moptBar i{display:block;height:100%;background:#00a4dc;transition:width .3s ease}
    .moptActions{margin-top:10px;display:flex;gap:8px;flex-wrap:wrap}
    .moptEmpty{opacity:.65;padding:18px 0}
    .moptStats{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:12px}
    .moptStat{flex:1 1 140px;border:1px solid rgba(128,128,128,.3);border-radius:5px;padding:9px 12px}
    .moptStatValue{font-size:19px;font-weight:600;font-variant-numeric:tabular-nums}
    .moptStatLabel{font-size:11.5px;opacity:.62;text-transform:uppercase;letter-spacing:.06em;margin-top:2px}
    .moptStatNote{font-size:12.5px;opacity:.65;margin-bottom:12px}
    .moptQueueBar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px}
    .moptPanel{border:1px solid rgba(128,128,128,.28);border-radius:6px;margin-bottom:14px;
      background:rgba(128,128,128,.05)}
    .moptSummary{display:flex;align-items:center;gap:10px;padding:10px 13px;cursor:pointer;
      list-style:none;font-size:14px;user-select:none}
    .moptSummary::-webkit-details-marker{display:none}
    .moptSummary::after{content:"\25BE";margin-left:auto;opacity:.5;font-size:12px;transition:transform .15s ease}
    .moptPanel[open] .moptSummary::after{transform:rotate(180deg)}
    .moptSummary:hover{background:rgba(128,128,128,.09)}
    .moptSummaryHint{opacity:.6;font-size:12.5px}
    .moptPanelBody{padding:2px 13px 13px}
    .moptErr{color:#e05a50;margin-top:5px;font-size:13px}
  </style>

  <script type="text/javascript">
    (function () {
      var page = document.querySelector('#MediaOptimizerQueuePage');
      var timer = null, searchTimer = null;
      var selection = {};      // itemId -> summary
      var shown = [];

      function bytes(n) {
        if (n === null || n === undefined) { return '—'; }
        if (n < 1024) { return n + ' B'; }
        var u = ['KiB','MiB','GiB','TiB'], v = n / 1024, i = 0;
        while (v >= 1024 && i < u.length - 1) { v /= 1024; i++; }
        return v.toFixed(v < 10 ? 2 : 1) + ' ' + u[i];
      }

      function api(method, path, body) {
        var opts = { type: method, url: ApiClient.getUrl(path), headers: { accept: 'application/json' } };
        if (body !== undefined) { opts.data = JSON.stringify(body); opts.contentType = 'application/json'; }
        return ApiClient.ajax(opts).then(function (r) {
          return typeof r === 'string' ? (r.length ? JSON.parse(r) : null) : r;
        });
      }

      function el(tag, cls, text) {
        var n = document.createElement(tag);
        if (cls) { n.className = cls; }
        if (text !== undefined && text !== null) { n.textContent = String(text); }
        return n;
      }

      // ---- status ----------------------------------------------------------------------
      function renderDiagnostics() {
        var host = page.querySelector('#moptDiag');
        api('GET', 'MediaOptimizer/Diagnostics').then(function (d) {
          var level = String(d.Overall || 'Ok').toLowerCase();
          page.querySelector('#moptDiagDot').className = 'moptDot ' + level;
          page.querySelector('#moptDiagLine').textContent = d.Summary;
          // Only demand attention when something is actually wrong.
          page.querySelector('#moptDiagPanel').open = level === 'failed';

          host.innerHTML = '';
          (d.Checks || []).forEach(function (c) {
            var row = el('div', 'moptCheck');
            row.appendChild(el('span', 'moptDot ' + String(c.Status).toLowerCase()));
            var body = el('div');
            body.appendChild(el('div', 'moptCheckName', c.Name));
            body.appendChild(el('div', 'moptCheckDetail', c.Detail));
            row.appendChild(body);
            host.appendChild(row);
          });
          var foot = el('div', 'moptCheckDetail', 'Plugin ' + d.PluginVersion + ' · Jellyfin ' + d.ServerVersion);
          foot.style.marginTop = '10px';
          host.appendChild(foot);
        }).catch(function (e) {
          host.innerHTML = '';
          host.appendChild(el('div', 'moptBanner failed',
            'The plugin API is not responding. It may have failed to load — check Dashboard → Logs.'));
          host.appendChild(el('div', 'moptCheckDetail', (e && e.statusText) || String(e)));
        });
      }

      // ---- file list -------------------------------------------------------------------
      function updateSelectionInfo() {
        var ids = Object.keys(selection);
        var total = 0;
        ids.forEach(function (id) { total += selection[id].SizeBytes || 0; });
        page.querySelector('#moptSelectionInfo').textContent = ids.length
          ? ids.length + ' selected · ' + bytes(total)
          : 'Nothing selected';
        page.querySelector('#moptBatch').disabled = ids.length === 0;
      }

      function renderResults(items) {
        shown = items || [];
        var host = page.querySelector('#moptResults');
        host.innerHTML = '';
        page.querySelector('#moptSelectAll').checked = false;

        page.querySelector('#moptPickerHint').textContent = shown.length
          ? shown.length + ' shown' : 'no matches';

        if (!shown.length) {
          host.appendChild(el('div', 'moptEmpty', 'Nothing matches those filters.'));
          updateSelectionInfo();
          return;
        }

        shown.forEach(function (item) {
          var row = el('div', 'moptItem' + (selection[item.Id] ? ' sel' : ''));

          var check = document.createElement('input');
          check.type = 'checkbox';
          check.checked = !!selection[item.Id];
          check.disabled = !!item.HasActiveJob;
          check.addEventListener('change', function () {
            if (check.checked) { selection[item.Id] = item; row.classList.add('sel'); }
            else { delete selection[item.Id]; row.classList.remove('sel'); }
            updateSelectionInfo();
          });
          row.appendChild(check);

          var body = el('div', 'moptItemBody');
          var name = el('div', 'moptItemName', item.Name);
          if (item.IsWatched === true) { name.appendChild(el('span', 'moptTag', 'watched')); }
          if (item.HasActiveJob) { name.appendChild(el('span', 'moptTag', 'queued')); }
          body.appendChild(name);
          body.appendChild(el('div', 'moptItemMeta', [
            bytes(item.SizeBytes),
            item.Height ? item.Height + 'p' : null,
            item.VideoCodec ? item.VideoCodec.toUpperCase() : null,
            item.Container ? item.Container.toUpperCase() : null
          ].filter(Boolean).join(' · ')));
          row.appendChild(body);

          var button = document.createElement('button');
          button.setAttribute('is', 'emby-button');
          button.type = 'button';
          button.className = 'raised emby-button';
          button.style.flex = '0 0 auto';
          button.textContent = item.HasActiveJob ? 'Queued' : 'Optimize…';
          button.disabled = !!item.HasActiveJob;
          if (!item.HasActiveJob) {
            button.addEventListener('click', function () { openFor(item.Id); });
          }
          row.appendChild(button);
          host.appendChild(row);
        });

        updateSelectionInfo();
      }

      function currentQuery() {
        function val(id) { return page.querySelector(id).value; }
        var params = ['limit=50',
          'query=' + encodeURIComponent(val('#moptSearch')),
          'sort=' + encodeURIComponent(val('#moptSort')),
          'watched=' + encodeURIComponent(val('#moptWatched'))];
        if (val('#moptMinHeight')) { params.push('minHeight=' + val('#moptMinHeight')); }
        if (val('#moptMinSize')) { params.push('minSizeMb=' + val('#moptMinSize')); }
        if (val('#moptContainer')) { params.push('container=' + encodeURIComponent(val('#moptContainer'))); }
        if (val('#moptCodec')) { params.push('codec=' + encodeURIComponent(val('#moptCodec'))); }
        return 'MediaOptimizer/Library/Search?' + params.join('&');
      }

      function search() {
        api('GET', currentQuery()).then(renderResults).catch(function (e) {
          var host = page.querySelector('#moptResults');
          host.innerHTML = '';
          host.appendChild(el('div', 'moptErr', 'Search failed: ' + ((e && e.statusText) || e)));
        });
      }

      function loadFacets() {
        api('GET', 'MediaOptimizer/Library/Facets').then(function (f) {
          function fill(id, values) {
            var select = page.querySelector(id);
            (values || []).forEach(function (v) {
              var o = document.createElement('option');
              o.value = v; o.textContent = v.toUpperCase();
              select.appendChild(o);
            });
          }
          fill('#moptContainer', f.containers);
          fill('#moptCodec', f.codecs);
        }).catch(function () { /* filters simply stay at "Any" */ });
      }

      // The dialog lives in the injected client bundle, so the dashboard and the in-app buttons
      // share one implementation and the dashboard keeps working when injection is broken.
      function withClient() {
        if (window.MediaOptimizer && window.MediaOptimizer.ready) {
          return Promise.resolve(window.MediaOptimizer);
        }
        return new Promise(function (resolve, reject) {
          if (!document.getElementById('moptClientScript')) {
            var script = document.createElement('script');
            script.id = 'moptClientScript';
            script.src = ApiClient.getUrl('MediaOptimizer/client.js');
            script.onerror = function () { reject(new Error('Could not load the plugin UI script.')); };
            document.head.appendChild(script);
          }
          var waited = 0;
          var poll = setInterval(function () {
            if (window.MediaOptimizer && window.MediaOptimizer.ready) { clearInterval(poll); resolve(window.MediaOptimizer); }
            else if ((waited += 100) > 10000) { clearInterval(poll); reject(new Error('The plugin UI script loaded but did not initialise.')); }
          }, 100);
        });
      }

      function openFor(itemId) {
        withClient().then(function (c) { c.open(itemId); }).catch(function (e) {
          Dashboard.alert({ title: 'Could not open the optimizer',
            message: e.message + ' The conversion queue below is unaffected.' });
        });
      }

      function openBatch() {
        var items = Object.keys(selection).map(function (id) { return selection[id]; });
        if (!items.length) { return; }
        withClient().then(function (c) { c.openBatch(items); }).catch(function (e) {
          Dashboard.alert({ title: 'Could not open the optimizer', message: e.message });
        });
      }

      // ---- queue -----------------------------------------------------------------------
      function renderJobs(jobs) {
        var host = page.querySelector('#moptJobs');
        var activeHost = page.querySelector('#moptActiveJobs');
        host.innerHTML = '';
        activeHost.innerHTML = '';

        jobs = jobs || [];
        var isActive = function (j) {
          return ['Queued','Preflight','Encoding','Verifying','Applying'].indexOf(j.Status) >= 0;
        };
        var active = jobs.filter(isActive);
        var history = jobs.filter(function (j) { return !isActive(j); });

        page.querySelector('#moptHistoryHint').textContent = history.length
          ? history.length + ' finished' : 'nothing yet';

        if (!active.length) {
          activeHost.appendChild(el('div', 'moptEmpty', 'Nothing running or queued.'));
        }
        if (!history.length) {
          host.appendChild(el('div', 'moptEmpty', 'No finished conversions yet.'));
        }

        jobs.forEach(function (j) {
          var target = isActive(j) ? activeHost : host;
          var box = el('div', 'moptJob');
          var head = el('div', 'moptJobHead');
          head.appendChild(el('span', 'moptJobName', j.ItemName || j.ItemId));
          head.appendChild(el('span', 'moptJobStatus', j.Status));
          box.appendChild(head);

          var bits = [j.OutputPolicy];
          if (j.SourceSizeBytes) {
            bits.push(bytes(j.SourceSizeBytes) + (j.OutputSizeBytes ? ' → ' + bytes(j.OutputSizeBytes) : ''));
          }
          if (j.Speed) { bits.push(j.Speed.toFixed(2) + '× realtime'); }
          if (j.EtaSeconds && j.Status === 'Encoding') { bits.push(Math.round(j.EtaSeconds / 60) + ' min remaining'); }
          if (j.IsLossless) { bits.push('lossless'); }
          if (j.LosslessVerified === true) { bits.push('hash verified'); }
          if (j.ResumeCount > 0) { bits.push('resumed after restart'); }
          box.appendChild(el('div', 'moptJobMeta', bits.join(' · ')));

          if (j.Status === 'Encoding' || j.Status === 'Verifying') {
            var bar = el('div', 'moptBar');
            var fill = el('i');
            fill.style.width = Math.round(j.ProgressPercent || 0) + '%';
            bar.appendChild(fill);
            box.appendChild(bar);
          }
          if (j.Error) { box.appendChild(el('div', 'moptErr', j.Error)); }

          var actions = el('div', 'moptActions');
          function button(label, handler) {
            var b = document.createElement('button');
            b.setAttribute('is', 'emby-button');
            b.type = 'button';
            b.className = 'raised emby-button';
            b.textContent = label;
            b.addEventListener('click', function () {
              b.disabled = true;
              handler().then(refresh).catch(function (e) {
                b.disabled = false;
                Dashboard.alert({ message: (e && e.statusText) || 'That did not work.' });
              });
            });
            actions.appendChild(b);
          }

          if (isActive(j)) {
            button('Cancel', function () { return api('DELETE', 'MediaOptimizer/Jobs/' + j.Id); });
            if (j.Status === 'Queued') {
              button('Run this next', function () { return api('POST', 'MediaOptimizer/Jobs/' + j.Id + '/MoveToFront'); });
            }
          } else {
            if (j.QuarantinePath) {
              button('Put the original back', function () {
                return Dashboard.confirm('Restore the original file and discard the converted one?', 'Undo conversion')
                  .then(function () { return api('POST', 'MediaOptimizer/Jobs/' + j.Id + '/Revert'); });
              });
            }
            if (['Failed','Interrupted','Cancelled'].indexOf(j.Status) >= 0) {
              button('Try again', function () { return api('POST', 'MediaOptimizer/Jobs/' + j.Id + '/Requeue'); });
            }
            if (!j.QuarantinePath) {
              button('Remove from history', function () { return api('DELETE', 'MediaOptimizer/Jobs/' + j.Id + '/History'); });
            }
          }
          if (actions.children.length) { box.appendChild(actions); }
          target.appendChild(box);
        });
      }

      function renderStats(s) {
        var host = page.querySelector('#moptStats');
        host.innerHTML = '';

        function stat(value, label) {
          var box = el('div', 'moptStat');
          box.appendChild(el('div', 'moptStatValue', value));
          box.appendChild(el('div', 'moptStatLabel', label));
          host.appendChild(box);
        }

        stat(bytes(s.BytesSaved), 'disk reclaimed');
        stat(s.CompletedJobs, 'files converted');
        stat(Math.round((s.AverageSavingFraction || 0) * 100) + '%', 'average reduction');
        stat(s.ActiveJobs, 'in the queue');
        if (s.RestorableOriginals > 0) {
          stat(bytes(s.QuarantineBytes), s.RestorableOriginals + ' originals still undoable');
        }

        var note = page.querySelector('#moptStatsNote');
        if (!note) {
          note = el('div', 'moptStatNote');
          note.id = 'moptStatsNote';
          host.parentNode.insertBefore(note, host.nextSibling);
        }
        note.textContent = s.SpeedNote || '';

        var pause = page.querySelector('#moptPause');
        pause.textContent = s.IsPaused ? 'Resume queue' : 'Pause queue';
        pause.dataset.paused = s.IsPaused ? '1' : '';
      }

      function refresh() {
        api('GET', 'MediaOptimizer/Statistics').then(renderStats).catch(function () {});
        return api('GET', 'MediaOptimizer/Jobs').then(renderJobs).catch(function () {});
      }

      // Jellyfin raises pageshow every time the user navigates back to this page, and the page
      // element itself is kept. Binding here unconditionally added a second click handler each
      // time, so after visiting twice "cancel everything pending" asked twice and the pause
      // button toggled itself straight back off.
      var bound = false;

      function bindOnce() {
        if (bound) { return; }
        bound = true;

        page.querySelector('#moptSearch').addEventListener('input', function () {
          clearTimeout(searchTimer);
          searchTimer = setTimeout(search, 300);
        });
        ['#moptSort','#moptWatched','#moptMinHeight','#moptMinSize','#moptContainer','#moptCodec']
          .forEach(function (id) { page.querySelector(id).addEventListener('change', search); });

        page.querySelector('#moptSelectAll').addEventListener('change', function (e) {
          shown.forEach(function (item) {
            if (item.HasActiveJob) { return; }
            if (e.target.checked) { selection[item.Id] = item; } else { delete selection[item.Id]; }
          });
          renderResults(shown);
        });

        page.querySelector('#moptBatch').addEventListener('click', openBatch);

        page.querySelector('#moptPause').addEventListener('click', function (e) {
          var paused = e.target.dataset.paused === '1';
          api('POST', 'MediaOptimizer/Queue/' + (paused ? 'Resume' : 'Pause')).then(refresh)
            .catch(function () { Dashboard.alert({ message: 'Could not change the queue state.' }); });
        });

        page.querySelector('#moptClear').addEventListener('click', function () {
          Dashboard.confirm('Cancel every job that has not started yet? Anything already running is left alone.',
            'Cancel pending jobs')
            .then(function () { return api('POST', 'MediaOptimizer/Queue/ClearPending'); })
            .then(refresh).catch(function () {});
        });

        page.querySelector('#moptRelease').addEventListener('click', function () {
          Dashboard.confirm(
            'Delete every original still held for undo? This frees the space immediately, but those ' +
            'conversions can no longer be reversed.', 'Free up space')
            .then(function () { return api('POST', 'MediaOptimizer/Queue/ReleaseQuarantine'); })
            .then(function (r) {
              Dashboard.alert({ message: 'Released ' + r.released + ' original(s), freeing ' + bytes(r.freedBytes) + '.' });
              return refresh();
            }).catch(function () {});
        });
      }

      page.addEventListener('pageshow', function () {
        bindOnce();

        renderDiagnostics();
        loadFacets();
        search();
        refresh();

        clearInterval(timer);
        timer = setInterval(refresh, 2000);
      });

      page.addEventListener('pagehide', function () {
        clearInterval(timer);
        clearTimeout(searchTimer);
      });
    })();
  </script>
</div>
</body>
</html>
