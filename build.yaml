owner: "oliverinhalo"
overview: "Inspect and convert media files from inside the Jellyfin interface."
description: >
  Adds a file information and conversion dialog to Jellyfin. Shows resolution, codec, bit depth,
  bitrate, frame rate, HDR type, audio tracks and container for any item, then converts it with
  FFmpeg using resolution, codec, bit depth, quality and audio presets. Includes a genuinely
  lossless mode whose bit-exactness is verified by hash after encoding. Conversions run in a
  background queue; the original file is never modified until the result passes verification.
category: "General"
artifacts:
