name: build

on:
  # The default branch by name, and every pull request. A branch with an open pull request would
  # otherwise be built twice for each push -- once for the branch and once for the merge ref --
  # and the two runs cannot be deduplicated by the concurrency group below, because their refs
  # differ. Work happens on branches that become pull requests immediately, so the pull_request
  # trigger is what actually covers it.
  push:
    branches: [main, "claude/jellyfin-media-optimizer-92xiw8"]
  pull_request:
  workflow_dispatch:

# A rapid series of pushes should not queue a run each; only the newest matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # A hung step should fail in minutes, not sit on a runner for six hours.
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      # The integration tests drive a real ffmpeg; without it they skip rather than fail, but the
      # lossless guarantees are only actually proven when it is present. ubuntu-latest ships it
      # already, so only reach for apt if it is genuinely missing — "apt-get update" depends on
      # mirrors that can hang for many minutes.
      - name: Ensure ffmpeg
        run: |
          if command -v ffmpeg >/dev/null 2>&1 && command -v ffprobe >/dev/null 2>&1; then
            ffmpeg -version | head -1
          else
            echo "ffmpeg not present; installing"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends ffmpeg
          fi

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --configuration Release --no-restore

      - name: Test
        run: dotnet test --configuration Release --no-build --verbosity normal

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Guards the private jellyfin-web selectors the injected UI depends on, proves the dialog
      # survives hostile host CSS, and renders both the dialog and the dashboard in a real browser
      # to catch layout regressions. web-tests/browser.mjs finds the Chromium installed here.
      - name: Install Chromium
        run: cd web-tests && npm install && npx playwright install --with-deps chromium

      - name: Web UI tests
        run: cd web-tests && npm test

      - name: Package
        run: |
          mkdir -p artifacts
          cp Jellyfin.Plugin.MediaOptimizer/bin/Release/net9.0/Jellyfin.Plugin.MediaOptimizer.dll artifacts/
          cd artifacts && zip -r media-optimizer.zip Jellyfin.Plugin.MediaOptimizer.dll

      - uses: actions/upload-artifact@v4
        with:
          name: media-optimizer
          path: artifacts/media-optimizer.zip
